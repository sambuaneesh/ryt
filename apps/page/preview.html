<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page preview</title>
  <style>
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f3efe4; }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 2px solid #131211; flex-wrap: wrap; }
    header b { margin-right: auto; }
    iframe { display: block; width: 100%; height: calc(100vh - 50px); border: 0; background: #fff; }
    #status { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <header>
    <b>Page preview</b>
    <label>Look <select id="theme"></select></label>
    <span id="status">waiting…</span>
  </header>
  <!-- Same sandbox Recommend You This uses for a fork. -->
  <iframe id="page" sandbox="allow-scripts allow-popups" src="./index.html" title="Your page"></iframe>
  <script type="module" src="./preview.js"></script>
</body>
</html>

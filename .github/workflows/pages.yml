# Publishes on GitHub Pages.
#   In the main repository: the web app at the site root, and the page code at /page/.
#   In a fork: only the page code, at the site root. That address is what you paste into
#   Recommend You This (Settings -> Advanced). See FORKING.md.
#
# One-time setup in the repository:
#   Settings -> Pages -> Source: GitHub Actions
#   Settings -> Secrets and variables -> Actions -> Variables:
#     SUPABASE_URL              https://<project-ref>.supabase.co
#     SUPABASE_PUBLISHABLE_KEY  sb_publishable_…   (public by design; RLS guards the data)
#     BASE_PATH                 optional: "/" for a custom domain (default "/<repo>/")

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Your page code must survive empty, huge, messy and hostile data before it goes live.
      - run: npm run check
      - name: Build
        run: |
          if [ "${{ github.event.repository.fork }}" = "true" ] && [ -z "${{ vars.SUPABASE_URL }}" ]; then
            npm run build:page
            mv dist/page site
          else
            npm run build
            mv dist site
          fi
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RYT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
